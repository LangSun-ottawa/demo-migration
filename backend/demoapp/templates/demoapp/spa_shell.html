<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Coexist Demo Angular Shell</title>
    <base href="/new/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% for stylesheet in stylesheets %}
      <link rel="stylesheet" href="{{ stylesheet }}">
    {% endfor %}
  </head>
  <body>
    {% if not scripts %}
      <div style="margin: 40px auto; max-width: 720px; font-family: Arial, sans-serif; line-height: 1.6;">
        <h1>Angular assets not built yet</h1>
        <p>Run <code>cd frontend && npm run build</code>, then refresh this page.</p>
      </div>
    {% endif %}
    <app-root></app-root>
    {% for script in scripts %}
      <script src="{{ script }}" type="module"></script>
    {% endfor %}
  </body>
</html>
