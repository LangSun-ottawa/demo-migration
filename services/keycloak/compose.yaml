services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: LocalKeycloakAdmin123!
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./demo-realm.json:/opt/keycloak/data/import/migration-demo-realm.json:ro
volumes:
  keycloak-data:
